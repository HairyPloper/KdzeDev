      trigger: true
      carry_data: true
    - from: Dado
      to: Miki
      trigger: true
      carry_data: true
  memory: []
  initial_instruction: |-
    Help a group of friends find a promising business idea they would enjoy building together under the company name Kdze. Consider any industry, including local services, physical products, and digital businesses.

    Use the group's size, members' skills and interests, shared budget, locations, and each person's available time from the launch brief. Do not assume a fixed number of founders or that the AI teammates are the actual founders. Kdze is the planned company name; do not assume it is already registered. Clearly flag missing information and any assumptions.

    Each teammate must complete only their assigned task, building on earlier findings. Keep ideas concrete: identify the customer, their problem, and an offer they might pay for.

    Be creative but realistic. Do not invent market research, customer interviews, competitor facts, or evidence of demand. Label estimates and unverified claims.

    Keep each teammate's response within 300 words. The final recommendation may use up to 500 words and must include:
    - One recommended idea and one runner-up.
    - Why the recommended idea fits the group and how members could share the work based on their stated skills and availability.
    - The smallest offer they could test.
    - Estimated startup costs and possible pricing.
    - The biggest risks and unknowns, including legal questions to check before launching a pilot.
    - A seven-day demand test with clear success and stop criteria.

    The goal is to select an idea worth testing, not claim that success is guaranteed.
  start:
    - Viki
  end:
    - Miki
