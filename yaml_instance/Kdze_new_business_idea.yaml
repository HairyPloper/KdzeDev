  memory: []
  initial_instruction: |-
    Help a group of friends find one promising business idea to test under the planned company name Kdze. Consider local services, physical products, and digital businesses.

    Use only the group size, skills, interests, budget, currency, locations, resources, and available time supplied in the launch brief. Missing information and unfilled placeholders such as [amount and currency] stay UNKNOWN. Never convert an unknown into a numeric or personal assumption. Separate KNOWN FACTS, ESTIMATES, and UNKNOWNS. Do not invent research, interviews, named customers, competitors, laws, test results, or evidence of demand.

    Each teammate completes only the assigned task. Pako's two shortlisted idea definitions are canonical and must remain stable. Ceki, Pijeki, Dinča, and Dado provide advisory reviews and never send work backward. QA planning never proves quality, demand, affordability, safety, or legal compliance. Prefer compact headings and bullets; do not use Markdown tables.

    Keep each teammate within 300 words. Miki may use 500 words and must provide one recommendation, one runner-up, founder fit based only on supplied facts, the smallest pilot, estimated costs and pricing, key risks and legal unknowns, and a seven-day demand test with measurable success and stop criteria. The goal is to choose an idea worth testing, not guarantee success.
  start:
    - Viki
  end:
    - Miki
