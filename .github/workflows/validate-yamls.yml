name: Validate workflows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend
        run: docker build --target runtime -t kdzedev-check .
      - name: Validate saved workflows without model calls
        run: >-
          docker run --rm
          -e BASE_URL=https://api.openai.com/v1
          -e API_KEY=validation-placeholder
          kdzedev-check python -m tools.validate_all_yamls
